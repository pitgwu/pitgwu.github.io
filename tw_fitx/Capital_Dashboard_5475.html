<meta charset="UTF-8">
<title>5475 日K / 60分K 技術分析儀表板</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#121212; color:#fff; padding:20px; }
.table th,.table td { text-align:right!important; vertical-align:middle; color:#fff; }
.table th:first-child,.table td:first-child { text-align:center!important; }
.section-title { border-bottom:2px solid #007bff; padding-bottom:10px; margin-top:30px; }
.chart-panel { display:none; }
.chart-panel.active { display:block; }
.period-switch { display:flex; gap:8px; align-items:center; margin-bottom:14px; }
.period-switch button { background:#2b2b2b; color:#ddd; border:1px solid #555; border-radius:6px; padding:8px 16px; cursor:pointer; font-size:14px; font-weight:600; }
.period-switch button:hover { background:#3a3a3a; }
.period-switch button.active { background:#1976d2 !important; color:#fff !important; border-color:#42a5f5 !important; box-shadow:0 0 0 2px rgba(66,165,245,.35) inset; }
.current-period { color:#90caf9; font-size:13px; font-weight:600; }

/* 畫圖工具列 */
.draw-toolbar {
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  margin:8px 0 10px 0; padding:8px 10px;
  background:#1d1d1d; border:1px solid #333; border-radius:6px;
}
.draw-toolbar .tool-label { color:#aaa; font-size:13px; margin-right:2px; }
.draw-toolbar .draw-color { width:34px; height:28px; padding:2px; border:1px solid #555; background:#2b2b2b; border-radius:5px; cursor:pointer; }
.draw-toolbar .color-label { color:#aaa; font-size:12px; margin-right:2px; }
.draw-toolbar button {
  background:#2b2b2b; color:#eee; border:1px solid #555;
  border-radius:5px; padding:5px 11px; cursor:pointer;
  font-size:13px;
}
.draw-toolbar button:hover { background:#3a3a3a; }
.draw-toolbar button.active { background:#1976d2; color:#fff; border-color:#42a5f5; }
.draw-hint { color:#888; font-size:12px; margin-left:4px; }
.pen-canvas { cursor: crosshair; }

/* Plotly K線/波段切換按鈕：避免 active 狀態變成白底白字 */
.updatemenu-button rect { fill:#2b2b2b !important; stroke:#555 !important; }
.updatemenu-button text { fill:#eee !important; }
</style>

<script>
const drawState = {};

function getChart(id) { return document.getElementById(id); }
function cloneObj(v) { try { return JSON.parse(JSON.stringify(v || [])); } catch(e) { return []; } }

function ensureDrawState(id) {
  const gd=getChart(id); if(!gd || !window.Plotly) return null;
  if(!drawState[id]) drawState[id]={
    mode:null,busy:false,firstPoint:null,fibFirst:null,
    baseShapes:cloneObj(gd.layout&&gd.layout.shapes),
    baseAnnotations:cloneObj(gd.layout&&gd.layout.annotations),
    penDrawing:false,penCanvas:null,penCtx:null
  };
  if(!gd.__drawHandlerReady) {
    gd.__drawHandlerReady=true;
    gd.on('plotly_click',ev=>handlePlotClick(id,ev));
    gd.on('plotly_buttonclicked',ev=>{
      const label=ev&&ev.button?String(ev.button.label||''):'';
      gd.__modeButtonIndex=label.indexOf('波段')>=0?1:0;
      setTimeout(()=>styleModeButtons(gd),20);
    });
    createPenCanvas(id);
    gd.addEventListener('pointerdown',ev=>handlePenPointerDown(id,ev));
    gd.addEventListener('pointermove',ev=>handlePenPointerMove(id,ev));
    gd.addEventListener('pointerup',ev=>handlePenPointerUp(id,ev));
    gd.addEventListener('pointercancel',ev=>handlePenPointerUp(id,ev));
  }
  return gd;
}

function getDrawColor(id) {
  const el=document.getElementById('color-'+id);
  return el&&el.value?el.value:'#f5c542';
}

function getChartXBounds(gd) {
  const ax=gd._fullLayout&&gd._fullLayout.xaxis;
  if(ax&&Array.isArray(ax.range)&&ax.range.length===2)
    return [Number(ax.range[0]),Number(ax.range[1])];
  const xs=[];
  (gd.data||[]).forEach(t=>(Array.isArray(t.x)?t.x:[]).forEach(v=>{
    if(Number.isFinite(Number(v))) xs.push(Number(v));
  }));
  return xs.length?[Math.min(...xs),Math.max(...xs)]:[0,1];
}

function nearestCandleIndex(gd,x) {
  const c=gd.data&&gd.data[0];
  if(!c||!Array.isArray(c.x)||!c.x.length) return -1;
  let best=0,dist=Infinity;
  c.x.forEach((v,i)=>{const d=Math.abs(Number(v)-Number(x));if(d<dist){dist=d;best=i;}});
  return best;
}

function getPlotPoint(gd,ev) {
  if(!ev||!ev.points||!ev.points.length) return null;
  const p=ev.points[0],x=Number(p.x),y=Number(p.y);
  if(!Number.isFinite(x)||!Number.isFinite(y)) return null;
  // 僅接受主圖 trace，避免點到 Volume/MACD/KD/RSI 後誤畫。
  if(Number.isFinite(Number(p.curveNumber))&&Number(p.curveNumber)>6) return null;
  return {x,y};
}

function createPenCanvas(id) {
  const gd=getChart(id); if(!gd) return null;
  let canvas=gd.querySelector('.pen-canvas');
  if(!canvas) {
    canvas=document.createElement('canvas');
    canvas.className='pen-canvas';
    gd.style.position='relative';
    canvas.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;z-index:20;pointer-events:none;touch-action:none;';
    gd.appendChild(canvas);
  }
  drawState[id].penCanvas=canvas;
  drawState[id].penCtx=canvas.getContext('2d');
  syncPenCanvas(id);
  return canvas;
}

function syncPenCanvas(id) {
  const gd=getChart(id),st=drawState[id]; if(!gd||!st) return;
  const c=st.penCanvas||createPenCanvas(id); if(!c) return;
  const w=Math.max(1,gd.clientWidth),h=Math.max(1,gd.clientHeight),dpr=window.devicePixelRatio||1;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)) {
    const old=document.createElement('canvas'); old.width=c.width; old.height=c.height;
    if(old.width&&old.height) old.getContext('2d').drawImage(c,0,0);
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    if(old.width&&old.height) ctx.drawImage(old,0,0,old.width/dpr,old.height/dpr,0,0,w,h);
  }
  c.style.pointerEvents=st.mode==='pen'?'auto':'none';
}

function setDrawMode(id,mode,btn) {
  const gd=ensureDrawState(id); if(!gd) return;
  const st=drawState[id];
  st.mode=mode; st.busy=false; st.firstPoint=null; st.fibFirst=null; st.penDrawing=false;
  document.querySelectorAll('.draw-toolbar button[data-chart="'+id+'"]').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  createPenCanvas(id); syncPenCanvas(id);
  // v6.1：完全停用 Plotly 原生 drawline/drawrect，所有圖形走統一 click-click。
  Plotly.relayout(gd,{dragmode:false});
}

function finishDrawMode(id) {
  const gd=getChart(id),st=drawState[id]; if(!gd||!st) return;
  st.mode=null;st.busy=false;st.firstPoint=null;st.fibFirst=null;st.penDrawing=false;
  syncPenCanvas(id); Plotly.relayout(gd,{dragmode:false});
  document.querySelectorAll('.draw-toolbar button[data-chart="'+id+'"]').forEach(b=>b.classList.remove('active'));
}

function addShape(gd,shape) {
  const shapes=cloneObj(gd.layout&&gd.layout.shapes); shapes.push(shape);
  return Plotly.relayout(gd,{shapes:shapes});
}

function handlePlotClick(id,ev) {
  const gd=getChart(id),st=drawState[id]; if(!gd||!st||!st.mode||st.mode==='pen'||st.busy) return;
  const p=getPlotPoint(gd,ev); if(!p) return;
  const color=getDrawColor(id);

  if(st.mode==='horizontal') {
    const [xMin,xMax]=getChartXBounds(gd); st.busy=true;
    addShape(gd,{type:'line',xref:'x',yref:'y',x0:xMin,x1:xMax,y0:p.y,y1:p.y,
      line:{color:color,width:2},name:'user_horizontal'}).then(()=>finishDrawMode(id));
    return;
  }

  if(st.mode==='line') {
    if(!st.firstPoint) { st.firstPoint={x:p.x,y:p.y}; return; }
    const p1=st.firstPoint; st.busy=true;
    addShape(gd,{type:'line',xref:'x',yref:'y',x0:p1.x,x1:p.x,y0:p1.y,y1:p.y,
      line:{color:color,width:2},name:'user_line'}).then(()=>finishDrawMode(id));
    return;
  }

  if(st.mode==='rect') {
    if(!st.firstPoint) { st.firstPoint={x:p.x,y:p.y}; return; }
    const p1=st.firstPoint; st.busy=true;
    addShape(gd,{type:'rect',xref:'x',yref:'y',
      x0:Math.min(p1.x,p.x),x1:Math.max(p1.x,p.x),
      y0:Math.min(p1.y,p.y),y1:Math.max(p1.y,p.y),
      line:{color:color,width:2},fillcolor:'rgba(0,0,0,0.03)',name:'user_rect'})
      .then(()=>finishDrawMode(id));
    return;
  }

  if(st.mode==='fib') {
    const c=gd.data&&gd.data[0],n=nearestCandleIndex(gd,p.x);
    if(!c||n<0||!Number.isFinite(Number(c.low[n]))||!Number.isFinite(Number(c.high[n]))) {
      finishDrawMode(id); return;
    }
    if(!st.fibFirst) {
      st.fibFirst={x:Number(c.x[n]),low:Number(c.low[n])};
      return;
    }

    const secondX=Number(c.x[n]),secondHigh=Number(c.high[n]);
    const low=Math.min(st.fibFirst.low,secondHigh),high=Math.max(st.fibFirst.low,secondHigh),range=high-low;
    if(!Number.isFinite(range)||range<=0) { finishDrawMode(id); return; }

    const [xMin,xMax]=getChartXBounds(gd);
    const levels=[[0,'0%'],[.236,'23.6%'],[.382,'38.2%'],[.5,'50%'],[.618,'61.8%'],[.786,'78.6%'],[1,'100%']];
    const shapes=cloneObj(gd.layout&&gd.layout.shapes),anns=cloneObj(gd.layout&&gd.layout.annotations);

    levels.forEach(([r,label])=>{
      const price=high-range*r;
      shapes.push({type:'line',xref:'x',yref:'y',x0:xMin,x1:xMax,y0:price,y1:price,
        line:{color:color,width:(r===0||r===1)?2:1.5,dash:(r===0||r===1)?'solid':'dot'},name:'user_fib'});
      anns.push({x:xMax,y:price,xref:'x',yref:'y',text:label+'  '+Math.round(price).toLocaleString(),
        showarrow:false,xanchor:'left',yanchor:'middle',font:{size:11,color:color},xshift:6,name:'user_fib'});
    });
    anns.push({x:st.fibFirst.x,y:st.fibFirst.low,xref:'x',yref:'y',
      text:'起點 Low '+Math.round(st.fibFirst.low).toLocaleString(),showarrow:true,arrowhead:2,ax:0,ay:28,
      font:{size:11,color:color},name:'user_fib'});
    anns.push({x:secondX,y:secondHigh,xref:'x',yref:'y',
      text:'終點 High '+Math.round(secondHigh).toLocaleString(),showarrow:true,arrowhead:2,ax:0,ay:-28,
      font:{size:11,color:color},name:'user_fib'});
    anns.push({x:(st.fibFirst.x+secondX)/2,y:high,xref:'x',yref:'y',
      text:'區間 '+Math.round(range).toLocaleString()+' 點',showarrow:false,yshift:14,
      font:{size:12,color:color},name:'user_fib'});

    st.busy=true;
    Plotly.relayout(gd,{shapes:shapes,annotations:anns}).then(()=>finishDrawMode(id));
  }
}

function clearDrawings(id) {
  const gd=ensureDrawState(id),st=drawState[id]; if(!gd||!st) return;
  st.mode=null;st.busy=false;st.firstPoint=null;st.fibFirst=null;st.penDrawing=false;
  if(st.penCtx&&st.penCanvas) st.penCtx.clearRect(0,0,st.penCanvas.width,st.penCanvas.height);
  Plotly.relayout(gd,{shapes:cloneObj(st.baseShapes),annotations:cloneObj(st.baseAnnotations),dragmode:false});
  document.querySelectorAll('.draw-toolbar button[data-chart="'+id+'"]').forEach(b=>b.classList.remove('active'));
  syncPenCanvas(id);
}

function screenPointInsidePlot(gd,cx,cy) {
  const r=gd.getBoundingClientRect(),s=gd._fullLayout&&gd._fullLayout._size;
  if(!s) return null;
  const l=r.left+s.l,t=r.top+s.t,rr=l+s.w,bb=t+s.h;
  if(cx<l||cx>rr||cy<t||cy>bb) return null;
  return {x:cx-l,y:cy-t};
}

function handlePenPointerDown(id,ev) {
  const st=drawState[id],gd=getChart(id); if(!st||!gd||st.mode!=='pen') return;
  const pt=screenPointInsidePlot(gd,ev.clientX,ev.clientY); if(!pt) return;
  ev.preventDefault();ev.stopPropagation();st.penDrawing=true;gd.setPointerCapture?.(ev.pointerId);
  const ctx=st.penCtx;if(!ctx) return;
  const color=getDrawColor(id);
  ctx.beginPath();ctx.arc(pt.x,pt.y,3,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
  ctx.beginPath();ctx.moveTo(pt.x,pt.y);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=color;ctx.lineWidth=6;
}

function handlePenPointerMove(id,ev) {
  const st=drawState[id],gd=getChart(id); if(!st||!gd||st.mode!=='pen'||!st.penDrawing) return;
  const pt=screenPointInsidePlot(gd,ev.clientX,ev.clientY); if(!pt) return;
  ev.preventDefault();ev.stopPropagation();
  const ctx=st.penCtx;if(!ctx) return;
  ctx.strokeStyle=getDrawColor(id);ctx.lineWidth=6;ctx.lineTo(pt.x,pt.y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(pt.x,pt.y);
}

function handlePenPointerUp(id,ev) {
  const st=drawState[id]; if(!st||st.mode!=='pen') return; st.penDrawing=false;
}

function styleModeButtons(gd) {
  if(!gd) return;
  const buttons=gd.querySelectorAll('.updatemenu-button');
  const activeIndex=Number.isInteger(gd.__modeButtonIndex)?gd.__modeButtonIndex:0;
  buttons.forEach((b,i)=>{
    const rect=b.querySelector('rect'),text=b.querySelector('text');
    if(rect) {
      rect.style.setProperty('fill',i===activeIndex?'#1976d2':'#2b2b2b','important');
      rect.style.setProperty('stroke','#555','important');
    }
    if(text) text.setAttribute('fill','#fff');
  });
}

function initChartTools() {
  ['intraday-chart','daily-chart'].forEach(id=>{
    const gd=getChart(id);
    if(gd) {
      ensureDrawState(id);
      setTimeout(()=>{syncPenCanvas(id);styleModeButtons(gd);},100);
    }
  });
  switchPeriod('60');
}

function switchPeriod(period) {
  const p60=document.getElementById('panel60'),pDay=document.getElementById('panelDay');
  const b60=document.getElementById('btn60'),bDay=document.getElementById('btnDay'),label=document.getElementById('currentPeriod');
  if(period==='60') {
    p60.classList.add('active');pDay.classList.remove('active');b60.classList.add('active');bDay.classList.remove('active');
    if(label) label.textContent='目前：60分K';
    setTimeout(()=>{const gd=getChart('intraday-chart');if(gd&&window.Plotly){Plotly.Plots.resize(gd);syncPenCanvas('intraday-chart');styleModeButtons(gd);}},50);
  } else {
    p60.classList.remove('active');pDay.classList.add('active');b60.classList.remove('active');bDay.classList.add('active');
    if(label) label.textContent='目前：日K';
    setTimeout(()=>{const gd=getChart('daily-chart');if(gd&&window.Plotly){Plotly.Plots.resize(gd);syncPenCanvas('daily-chart');styleModeButtons(gd);}},50);
  }
}
setTimeout(initChartTools,500);
</script>
