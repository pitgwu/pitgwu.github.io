
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>台指期 日K / 60分K 技術分析儀表板</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#121212; color:#fff; padding:20px; }
.table th,.table td { text-align:right!important; vertical-align:middle; color:#fff; }
.table th:first-child,.table td:first-child { text-align:center!important; }
.section-title { border-bottom:2px solid #007bff; padding-bottom:10px; margin-top:30px; }
.chart-panel { display:none; }
.chart-panel.active { display:block; }
.period-switch { display:flex; gap:8px; align-items:center; margin-bottom:14px; }
.period-switch button { background:#2b2b2b; color:#ddd; border:1px solid #555; border-radius:6px; padding:8px 16px; cursor:pointer; font-size:14px; font-weight:600; }
.period-switch button:hover { background:#3a3a3a; }
.period-switch button.active { background:#1976d2 !important; color:#fff !important; border-color:#42a5f5 !important; box-shadow:0 0 0 2px rgba(66,165,245,.35) inset; }
.current-period { color:#90caf9; font-size:13px; font-weight:600; }

/* 畫圖工具列 */
.draw-toolbar {
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  margin:8px 0 10px 0; padding:8px 10px;
  background:#1d1d1d; border:1px solid #333; border-radius:6px;
}
.draw-toolbar .tool-label { color:#aaa; font-size:13px; margin-right:2px; }
.draw-toolbar .draw-color { width:34px; height:28px; padding:2px; border:1px solid #555; background:#2b2b2b; border-radius:5px; cursor:pointer; }
.draw-toolbar .color-label { color:#aaa; font-size:12px; margin-right:2px; }
.draw-toolbar button {
  background:#2b2b2b; color:#eee; border:1px solid #555;
  border-radius:5px; padding:5px 11px; cursor:pointer;
  font-size:13px;
}
.draw-toolbar button:hover { background:#3a3a3a; }
.draw-toolbar button.active { background:#1976d2; color:#fff; border-color:#42a5f5; }
.draw-hint { color:#888; font-size:12px; margin-left:4px; }
.pen-canvas { cursor: crosshair; }

/* Plotly K線/波段切換按鈕：避免 active 狀態變成白底白字 */
.updatemenu-button rect { fill:#2b2b2b !important; stroke:#555 !important; }
.updatemenu-button text { fill:#eee !important; }
</style>
</head>

<div class="container-fluid">
<h1 class="mb-4">📈 台指期 技術分析儀表板</h1>
<div class="period-switch" role="group">

  <span id="currentPeriod" class="current-period">目前：60分K</span>
</div>
<h3 class="section-title">1. 技術線圖</h3>

    levels.forEach(([r,label])=>{const price=high-range*r;shapes.push({type:'line',xref:'x',yref:'y',x0:xMin,x1:xMax,y0:price,y1:price,line:{color:color,width:(r===0||r===1)?2:1.5,dash:(r===0||r===1)?'solid':'dot'},name:'user_fib'});anns.push({x:xMax,y:price,xref:'x',yref:'y',text:label+'  '+Math.round(price).toLocaleString(),showarrow:false,xanchor:'left',yanchor:'middle',font:{size:11,color:color},xshift:6,name:'user_fib'});});
    anns.push({x:st.fibFirst.x,y:low,xref:'x',yref:'y',text:'低點 '+Math.round(low).toLocaleString(),showarrow:true,arrowhead:2,ax:0,ay:28,font:{size:11,color:color},name:'user_fib'});
    anns.push({x:second.x,y:high,xref:'x',yref:'y',text:'高點 '+Math.round(high).toLocaleString(),showarrow:true,arrowhead:2,ax:0,ay:-28,font:{size:11,color:color},name:'user_fib'});
    anns.push({x:(st.fibFirst.x+second.x)/2,y:high,xref:'x',yref:'y',text:'區間 '+Math.round(range).toLocaleString()+' 點',showarrow:false,yshift:14,font:{size:12,color:color},name:'user_fib'});
    Plotly.relayout(gd,{shapes:shapes,annotations:anns}).then(()=>finishDrawMode(id));
  }
}
function handleDrawRelayout(id,ev) {
  const gd=getChart(id),st=drawState[id];if(!gd||!st||!st.mode||st.busy)return;const keys=Object.keys(ev||{});if(!keys.some(k=>k.indexOf('shapes[')===0))return;const shapes=gd.layout.shapes||[];if(!shapes.length)return;const idx=shapes.length-1,shape=shapes[idx];if(!shape)return;const color=getDrawColor(id);st.busy=true;
  if(st.mode==='line'&&shape.type==='line'){Plotly.relayout(gd,{['shapes['+idx+'].line.color']:color,['shapes['+idx+'].line.width']:2,['shapes['+idx+'].name']:'user_line'}).then(()=>finishDrawMode(id));return;}
  if(st.mode==='rect'&&shape.type==='rect'){Plotly.relayout(gd,{['shapes['+idx+'].line.color']:color,['shapes['+idx+'].line.width']:2,['shapes['+idx+'].name']:'user_rect'}).then(()=>finishDrawMode(id));return;}
  st.busy=false;
}
function clearDrawings(id) {
  const gd=ensureDrawState(id),st=drawState[id];if(!gd||!st)return;st.mode=null;st.busy=false;st.fibFirst=null;st.penDrawing=false;if(st.penCtx&&st.penCanvas)st.penCtx.clearRect(0,0,st.penCanvas.width,st.penCanvas.height);
  Plotly.relayout(gd,{shapes:cloneObj(st.baseShapes),annotations:cloneObj(st.baseAnnotations),dragmode:false});document.querySelectorAll('.draw-toolbar button[data-chart="'+id+'"]').forEach(b=>b.classList.remove('active'));syncPenCanvas(id);
}
function screenPointInsidePlot(gd,cx,cy){const r=gd.getBoundingClientRect(),s=gd._fullLayout&&gd._fullLayout._size;if(!s)return null;const l=r.left+s.l,t=r.top+s.t,rr=l+s.w,bb=t+s.h;if(cx<l||cx>rr||cy<t||cy>bb)return null;return{x:cx-l,y:cy-t};}
function handlePenPointerDown(id,ev){const st=drawState[id],gd=getChart(id);if(!st||!gd||st.mode!=='pen')return;const pt=screenPointInsidePlot(gd,ev.clientX,ev.clientY);if(!pt)return;ev.preventDefault();ev.stopPropagation();st.penDrawing=true;gd.setPointerCapture?.(ev.pointerId);const ctx=st.penCtx;if(!ctx)return;ctx.beginPath();ctx.moveTo(pt.x,pt.y);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=getDrawColor(id);ctx.lineWidth=6;ctx.lineTo(pt.x+.01,pt.y+.01);ctx.stroke();}
function handlePenPointerMove(id,ev){const st=drawState[id],gd=getChart(id);if(!st||!gd||st.mode!=='pen'||!st.penDrawing)return;const pt=screenPointInsidePlot(gd,ev.clientX,ev.clientY);if(!pt)return;ev.preventDefault();ev.stopPropagation();const ctx=st.penCtx;if(!ctx)return;ctx.lineTo(pt.x,pt.y);ctx.stroke();ctx.beginPath();ctx.moveTo(pt.x,pt.y);}
function handlePenPointerUp(id,ev){const st=drawState[id];if(!st||st.mode!=='pen')return;st.penDrawing=false;}
function styleModeButtons(gd){if(!gd)return;const buttons=gd.querySelectorAll('.updatemenu-button'),activeIndex=Number.isInteger(gd.__modeButtonIndex)?gd.__modeButtonIndex:0;buttons.forEach((b,i)=>{const rect=b.querySelector('rect'),text=b.querySelector('text');if(rect){rect.style.setProperty('fill',i===activeIndex?'#1976d2':'#2b2b2b','important');rect.style.setProperty('stroke','#555','important');}if(text)text.setAttribute('fill','#fff');});}
function initChartTools() {
  ['intraday-chart','daily-chart'].forEach(id => {
    const gd=getChart(id); if(gd) { ensureDrawState(id); setTimeout(() => { syncPenCanvas(id); styleModeButtons(gd); },100); }
  });
  switchPeriod('60');
}

function switchPeriod(period) {
  const p60=document.getElementById('panel60'), pDay=document.getElementById('panelDay');
  const b60=document.getElementById('btn60'), bDay=document.getElementById('btnDay');
  const label=document.getElementById('currentPeriod');
  if(period==='60') {
    p60.classList.add('active'); pDay.classList.remove('active');
    b60.classList.add('active'); bDay.classList.remove('active');
    if(label) label.textContent='目前：60分K';
    setTimeout(() => { const gd=getChart('intraday-chart'); if(gd&&window.Plotly) { Plotly.Plots.resize(gd); syncPenCanvas('intraday-chart'); } },50);
  } else {
    p60.classList.remove('active'); pDay.classList.add('active');
    b60.classList.remove('active'); bDay.classList.add('active');
    if(label) label.textContent='目前：日K';
    setTimeout(() => { const gd=getChart('daily-chart'); if(gd&&window.Plotly) { Plotly.Plots.resize(gd); syncPenCanvas('daily-chart'); } },50);
  }
}

setTimeout(initChartTools, 500);
</script>
