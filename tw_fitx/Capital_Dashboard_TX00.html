<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>台指期 日K / 60分K 技術分析儀表板</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#121212; color:#fff; padding:20px; }
.table th,.table td { text-align:right!important; vertical-align:middle; color:#fff; }
.table th:first-child,.table td:first-child { text-align:center!important; }
.section-title { border-bottom:2px solid #007bff; padding-bottom:10px; margin-top:30px; }
.chart-panel { display:none; }
.chart-panel.active { display:block; }
.period-switch { display:flex; gap:8px; align-items:center; margin-bottom:14px; }
.period-switch button { background:#2b2b2b; color:#ddd; border:1px solid #555; border-radius:6px; padding:8px 16px; cursor:pointer; font-size:14px; font-weight:600; }
.period-switch button:hover { background:#3a3a3a; }
.period-switch button.active { background:#1976d2 !important; color:#fff !important; border-color:#42a5f5 !important; box-shadow:0 0 0 2px rgba(66,165,245,.35) inset; }
.current-period { color:#90caf9; font-size:13px; font-weight:600; }

/* 畫圖工具列 */
.draw-toolbar {
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  margin:8px 0 10px 0; padding:8px 10px;
  background:#1d1d1d; border:1px solid #333; border-radius:6px;
}
.draw-toolbar .tool-label { color:#aaa; font-size:13px; margin-right:2px; }
.draw-toolbar .draw-color { width:34px; height:28px; padding:2px; border:1px solid #555; background:#2b2b2b; border-radius:5px; cursor:pointer; }
.draw-toolbar .draw-width { width:42px; height:28px; background:#2b2b2b; color:#eee; border:1px solid #555; border-radius:4px; text-align:center; }
.draw-toolbar .color-label { color:#aaa; font-size:12px; margin-right:2px; }
.draw-toolbar button {
  background:#2b2b2b; color:#eee; border:1px solid #555;
  border-radius:5px; padding:5px 11px; cursor:pointer;
  font-size:13px;
}
.draw-toolbar button:hover { background:#3a3a3a; }
.draw-toolbar button.active { background:#1976d2; color:#fff; border-color:#42a5f5; }
.draw-hint { color:#888; font-size:12px; margin-left:4px; }
.pen-canvas { cursor: crosshair; }

/* Plotly K線/波段切換按鈕 */
.updatemenu-button rect { fill:#2b2b2b !important; stroke:#555 !important; }
.updatemenu-button text { fill:#eee !important; }
</style>
</head>

<div class="container-fluid">
<h1 class="mb-4">📈 台指期 技術分析儀表板</h1>
<div class="period-switch" role="group">
  <button id="btn60" class="active" onclick="switchPeriod('60')">⏱ 60分K｜近7天</button>
  <button id="btnDay" onclick="switchPeriod('day')">📅 日K｜近6個月</button>
  <span id="currentPeriod" class="current-period">目前：60分K</span>
</div>
<h3 class="section-title">1. 技術線圖</h3>

<div id="panel60" class="chart-panel active">

<script>
const drawState = {};

function getChart(id) { return document.getElementById(id); }
function cloneObj(v) { try { return JSON.parse(JSON.stringify(v || [])); } catch(e) { return []; } }

function ensureDrawState(id) {
  const gd=getChart(id); if(!gd || !window.Plotly) return null;
  if(!drawState[id]) drawState[id]={
    mode:null,busy:false,
    history:[], // 🛠️ 儲存「復原上一動」的歷史紀錄
    baseShapes:cloneObj(gd.layout&&gd.layout.shapes),
    baseAnnotations:cloneObj(gd.layout&&gd.layout.annotations),
    penDrawing:false,penCanvas:null,penCtx:null
  };
  if(!gd.__drawHandlerReady) {
    gd.__drawHandlerReady=true;
    gd.on('plotly_relayout',ev=>handleDrawRelayout(id,ev));
    gd.on('plotly_click',ev=>handlePlotClick(id,ev)); // 恢復原生點擊事件
    gd.on('plotly_buttonclicked',ev=>{
      const label=ev&&ev.button?String(ev.button.label||''):'';
      const isWave=label.indexOf('波段')>=0;
      gd.__modeButtonIndex=isWave?1:0;
      setTimeout(()=>{
        styleModeButtons(gd);
        const anns=cloneObj(gd.layout&&gd.layout.annotations);
        let changed=false;
        anns.forEach(a=>{
          if(a&&a.name==='ma_deduct'){ a.visible=!isWave; changed=true; }
        });
        if(changed) Plotly.relayout(gd,{annotations:anns});
      },20);
    });
    createPenCanvas(id);
  }
  syncPenCanvas(id);
  return gd;
}

function getDrawColor(id) {
  const el=document.getElementById('color-'+id);
  return el?el.value:'#f5c542';
}

function getDrawWidth(id) {
  const el=document.getElementById('width-'+id);
  return el?(Number(el.value)||2):2;
}

function undoDraw(id) {
  const gd=getChart(id), st=drawState[id];
  if(!gd || !st || !st.history || st.history.length === 0) return;
  const prevState = st.history.pop();
  Plotly.relayout(gd, {
    shapes: prevState.shapes,
    annotations: prevState.annotations
  });
}

function getChartXBounds(gd) {
  const ax=gd._fullLayout&&gd._fullLayout.xaxis;
  if(ax&&Array.isArray(ax.range)&&ax.range.length===2) return [Number(ax.range[0]),Number(ax.range[1])];
  const xs=[];
  (gd.data||[]).forEach(t=>(Array.isArray(t.x)?t.x:[]).forEach(v=>{
    if(Number.isFinite(Number(v))) xs.push(Number(v));
  }));
  return xs.length?[Math.min(...xs),Math.max(...xs)]:[0,1];
}

function getPlotClickData(ev) {
  if(!ev) return null;
  let x=null,y=null;
  if(Array.isArray(ev.xvals)&&ev.xvals.length) x=Number(ev.xvals[0]);
  if(Array.isArray(ev.yvals)&&ev.yvals.length) y=Number(ev.yvals[0]);
  if((!Number.isFinite(x)||!Number.isFinite(y)) && ev.points && ev.points.length) {
    x=Number(ev.points[0].x); y=Number(ev.points[0].y);
  }
  return Number.isFinite(x)&&Number.isFinite(y)?{x,y}:null;
}

function createPenCanvas(id) {
  const gd=getChart(id); if(!gd) return null;
  const st=drawState[id]; if(!st) return null;
  let canvas=gd.querySelector('.pen-canvas');
  if(!canvas) {
    canvas=document.createElement('canvas');
    canvas.className='pen-canvas';
    gd.style.position='relative';
    canvas.style.cssText='position:absolute;z-index:20;pointer-events:none;touch-action:none;cursor:crosshair;';
    gd.appendChild(canvas);
    st.penCanvas=canvas;
    st.penCtx=canvas.getContext('2d');
    canvas.addEventListener('pointerdown',ev=>handlePenPointerDown(id,ev));
    canvas.addEventListener('pointermove',ev=>handlePenPointerMove(id,ev));
    canvas.addEventListener('pointerup',ev=>handlePenPointerUp(id,ev));
    canvas.addEventListener('pointercancel',ev=>handlePenPointerUp(id,ev));
  } else {
    st.penCanvas=canvas;
    st.penCtx=canvas.getContext('2d');
  }
  syncPenCanvas(id);
  return canvas;
}

function getPlotBox(gd) {
  const r=gd.getBoundingClientRect();
  const s=gd._fullLayout&&gd._fullLayout._size;
  if(!s) return null;
  return {left:s.l,top:s.t,width:s.w,height:s.h,
           screenLeft:r.left+s.l,screenTop:r.top+s.t,
           screenRight:r.left+s.l+s.w,screenBottom:r.top+s.t+s.h};
}

function syncPenCanvas(id) {
  const gd=getChart(id),st=drawState[id]; if(!gd||!st) return;
  const c=st.penCanvas||createPenCanvas(id); if(!c) return;
  const box=getPlotBox(gd); if(!box) return;
  const dpr=window.devicePixelRatio||1;
  const w=Math.max(1,Math.round(box.width));
  const h=Math.max(1,Math.round(box.height));
  const oldW=c.width,oldH=c.height;
  c.style.left=box.left+'px';
  c.style.top=box.top+'px';
  c.style.width=w+'px';
  c.style.height=h+'px';
  if(oldW!==Math.round(w*dpr)||oldH!==Math.round(h*dpr)) {
    let old=null;
    if(oldW>0&&oldH>0) {
      old=document.createElement('canvas');
      old.width=oldW; old.height=oldH;
      try { old.getContext('2d').drawImage(c,0,0); } catch(e) {}
    }
    c.width=Math.round(w*dpr);
    c.height=Math.round(h*dpr);
    const ctx=c.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(old) {
      try { ctx.drawImage(old,0,0,oldW/dpr,oldH/dpr,0,0,w,h); } catch(e) {}
    }
  } else if(st.penCtx) {
    st.penCtx.setTransform(dpr,0,0,dpr,0,0);
  }
  c.style.pointerEvents=st.mode==='pen'?'auto':'none';
}

function setDrawMode(id,mode,btn) {
  const gd=ensureDrawState(id); if(!gd) return;
  const st=drawState[id];
  st.mode=mode; st.busy=false; st.penDrawing=false;
  document.querySelectorAll('.draw-toolbar button[data-chart="'+id+'"]').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  createPenCanvas(id); syncPenCanvas(id);
  
  const color=getDrawColor(id);
  const width=getDrawWidth(id);

  if(mode==='line') {
    Plotly.relayout(gd,{dragmode:'drawline',newshape:{line:{color:color,width:width}}});
  } else if(mode==='horizontal') {
    Plotly.relayout(gd,{dragmode:false}); // 解除拖曳，專心接收點擊
  } else if(mode==='rect') {
    Plotly.relayout(gd,{dragmode:'drawrect',newshape:{line:{color:color,width:width},fillcolor:'rgba(0,0,0,0.03)'}});
  } else if(mode==='fib') {
    Plotly.relayout(gd,{dragmode:'drawline',newshape:{line:{color:color,width:width,dash:'dot'}}});
  } else {
    Plotly.relayout(gd,{dragmode:false});
  }
  syncPenCanvas(id);
}

function finishDrawMode(id) {
  const gd=getChart(id),st=drawState[id]; if(!gd||!st) return;
  st.mode=null; st.busy=false; st.penDrawing=false;
  syncPenCanvas(id);
  Plotly.relayout(gd,{dragmode:false});
  document.querySelectorAll('.draw-toolbar button[data-chart="'+id+'"]').forEach(b=>b.classList.remove('active'));
}

function handlePlotClick(id,ev) {
  const gd=getChart(id),st=drawState[id];
  if(!gd||!st||!st.mode||st.mode==='pen') return;

  const p=getPlotClickData(ev); if(!p) return;

  // 處理水平線點擊繪製
  if(st.mode==='horizontal') {
    st.history.push({
      shapes: cloneObj(gd.layout.shapes),
      annotations: cloneObj(gd.layout.annotations)
    });
    if(st.history.length > 30) st.history.shift();

    const [xMin,xMax]=getChartXBounds(gd);
    const color=getDrawColor(id);
    const width=getDrawWidth(id);
    let newShapes = gd.layout.shapes ? JSON.parse(JSON.stringify(gd.layout.shapes)) : [];
    newShapes.push({
      type:'line',xref:'x',yref:'y',x0:xMin,x1:xMax,y0:p.y,y1:p.y,
      line:{color:color,width:width},name:'user_horizontal'
    });
    Plotly.relayout(gd,{shapes: newShapes}).then(()=>finishDrawMode(id));
  }
}

function handleDrawRelayout(id,ev) {
  const gd=getChart(id),st=drawState[id];
  if(!gd||!st||!st.mode||st.busy) return;

  const keys=Object.keys(ev||{});
  if(!keys.some(k=>k.includes('shapes'))) return;

  const shapes=gd.layout.shapes||[];
  if(shapes.length === 0) return;

  st.busy=true;
  const color=getDrawColor(id);
  const width=getDrawWidth(id);

  let prevShapes = JSON.parse(JSON.stringify(shapes));
  const currentShape = prevShapes.pop(); // 取出最後一個新增的形狀

  // 儲存歷史 (不包含剛剛新增的，這樣復原時就會退回到畫之前的狀態)
  st.history.push({
      shapes: prevShapes,
      annotations: cloneObj(gd.layout.annotations)
  });
  if(st.history.length > 30) st.history.shift();

  let newShapes = JSON.parse(JSON.stringify(shapes));

  // 攔截並展開「黃金切割率」
  if(st.mode==='fib' && currentShape.type==='line') {
    newShapes.pop(); // 刪除你剛才拖曳出來的那條虛線

    // 🛠️ 磁吸對齊函數 (Auto-Snap)
    function snap(x, y, isTop) {
        const c = gd.data && gd.data.find(t => t.type === 'candlestick');
        if (!c || !c.high || !c.low) return {x, y};
        const i = Math.round(x);
        
        // 如果 X 落在某根 K 棒的中心附近 (誤差小於 0.45)
        if (i >= 0 && i < c.x.length && Math.abs(x - i) <= 0.45) {
            const h = Number(c.high[i]);
            const l = Number(c.low[i]);
            // 判斷 Y 軸是否有對準：給予 K棒實體高度 50% 的上下寬容度，最少容許 20 點誤差
            const range = Math.max(h - l, 20);
            if (y >= l - range * 0.5 && y <= h + range * 0.5) {
                return { x: i, y: isTop ? h : l };
            }
        }
        return {x, y}; // 如果畫在太遠的空白處，就不吸附
    }

    let isP0Top = currentShape.y0 >= currentShape.y1;
    let p0 = snap(currentShape.x0, currentShape.y0, isP0Top);
    let p1 = snap(currentShape.x1, currentShape.y1, !isP0Top);

    const low = Math.min(p0.y, p1.y);
    const high = Math.max(p0.y, p1.y);
    const range = high - low;

    if (range > 0) {
        const [xMin,xMax] = getChartXBounds(gd);
        const levels = [[0,'0%'],[.236,'23.6%'],[.382,'38.2%'],[.5,'50%'],[.618,'61.8%'],[.786,'78.6%'],[1,'100%']];
        let anns = JSON.parse(JSON.stringify(gd.layout.annotations||[]));
        anns = anns.filter(a=>!a||a.name!=='user_fib');
        newShapes = newShapes.filter(s=>!s||s.name!=='user_fib');

        levels.forEach(([r,label])=>{
            // 🛠️ 100% 在最高點，0% 在最低點
            const price = low + range * r;
            newShapes.push({type:'line',xref:'x',yref:'y',x0:xMin,x1:xMax,y0:price,y1:price,line:{color,width:(r===0||r===1)?width:Math.max(1, width-1),dash:(r===0||r===1)?'solid':'dot'},name:'user_fib'});
            anns.push({x:xMax,y:price,xref:'x',yref:'y',text:label+'  '+Math.round(price).toLocaleString(),showarrow:false,xanchor:'left',yanchor:'middle',font:{size:11,color},xshift:6,name:'user_fib'});
        });
        anns.push({x:p0.x,y:p0.y,xref:'x',yref:'y',text:Math.round(p0.y).toLocaleString(),showarrow:true,arrowhead:2,ax:0,ay:(p0.y===low?28:-28),font:{size:11,color},name:'user_fib'});
        anns.push({x:p1.x,y:p1.y,xref:'x',yref:'y',text:Math.round(p1.y).toLocaleString(),showarrow:true,arrowhead:2,ax:0,ay:(p1.y===high?-28:28),font:{size:11,color},name:'user_fib'});
        anns.push({x:(Number(p0.x)+Number(p1.x))/2,y:high,xref:'x',yref:'y',text:'區間 '+Math.round(range).toLocaleString()+' 點',showarrow:false,yshift:14,font:{size:12,color},name:'user_fib'});

        Plotly.relayout(gd,{shapes: newShapes, annotations: anns}).then(()=>finishDrawMode(id));
    } else {
        Plotly.relayout(gd,{shapes: newShapes}).then(()=>finishDrawMode(id));
    }
    return;
  }

  // 一般圖形處理 (直線 / 框)
  if(currentShape.type==='line' || currentShape.type==='rect') {
    currentShape.line.color = color;
    currentShape.line.width = width;
    currentShape.name = 'user_' + currentShape.type;
    Plotly.relayout(gd,{shapes: newShapes}).then(()=>finishDrawMode(id));
    return;
  }

  st.busy=false;
}

function clearDrawings(id) {
  const gd=ensureDrawState(id),st=drawState[id]; if(!gd||!st) return;
  st.mode=null; st.busy=false; st.penDrawing=false;
  st.history=[]; // 清空歷史
  if(st.penCtx&&st.penCanvas) {
    st.penCtx.clearRect(0,0,st.penCanvas.width,st.penCanvas.height);
  }
  Plotly.relayout(gd,{
    shapes:cloneObj(st.baseShapes),
    annotations:cloneObj(st.baseAnnotations),
    dragmode:false
  });
  document.querySelectorAll('.draw-toolbar button[data-chart="'+id+'"]').forEach(b=>b.classList.remove('active'));
  syncPenCanvas(id);
}

function handlePenPointerDown(id,ev) {
  const st=drawState[id],gd=getChart(id);
  if(!st||!gd||st.mode!=='pen'||!st.penCanvas) return;
  const r=st.penCanvas.getBoundingClientRect();
  if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom) return;
  ev.preventDefault(); ev.stopPropagation();
  st.penDrawing=true;
  try { st.penCanvas.setPointerCapture(ev.pointerId); } catch(e) {}
  const ctx=st.penCtx; if(!ctx) return;
  const x=ev.clientX-r.left, y=ev.clientY-r.top;
  const dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.beginPath(); ctx.moveTo(x,y);
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=getDrawColor(id); ctx.lineWidth=getDrawWidth(id);
  ctx.lineTo(x+0.01,y+0.01); ctx.stroke();
}

function handlePenPointerMove(id,ev) {
  const st=drawState[id]; if(!st||st.mode!=='pen'||!st.penDrawing||!st.penCanvas) return;
  ev.preventDefault(); ev.stopPropagation();
  const r=st.penCanvas.getBoundingClientRect();
  const x=Math.max(0,Math.min(r.width,ev.clientX-r.left));
  const y=Math.max(0,Math.min(r.height,ev.clientY-r.top));
  const ctx=st.penCtx; if(!ctx) return;
  const dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineTo(x,y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y);
}

function handlePenPointerUp(id,ev) {
  const st=drawState[id]; if(!st||st.mode!=='pen') return;
  st.penDrawing=false;
  try { st.penCanvas&&st.penCanvas.releasePointerCapture(ev.pointerId); } catch(e) {}
}

function styleModeButtons(gd) {
  if(!gd) return;
  const buttons=gd.querySelectorAll('.updatemenu-button');
  const activeIndex=Number.isInteger(gd.__modeButtonIndex)?gd.__modeButtonIndex:0;
  buttons.forEach((b,i)=>{
    const rect=b.querySelector('rect'),text=b.querySelector('text');
    if(rect) {
      rect.style.setProperty('fill',i===activeIndex?'#1976d2':'#2b2b2b','important');
      rect.style.setProperty('stroke','#555','important');
    }
    if(text) text.setAttribute('fill','#fff');
  });
}

function initChartTools() {
  ['intraday-chart','daily-chart'].forEach(id=>{
    const gd=getChart(id);
    if(gd) {
      ensureDrawState(id);
      setTimeout(()=>{ syncPenCanvas(id); styleModeButtons(gd); },100);
      window.addEventListener('resize',()=>{
        setTimeout(()=>{
          if(window.Plotly) Plotly.Plots.resize(gd);
          syncPenCanvas(id);
        },50);
      });
    }
  });
  switchPeriod('60');
}

function switchPeriod(period) {
  const p60=document.getElementById('panel60'), pDay=document.getElementById('panelDay');
  const b60=document.getElementById('btn60'), bDay=document.getElementById('btnDay');
  const label=document.getElementById('currentPeriod');
  if(period==='60') {
    p60.classList.add('active'); pDay.classList.remove('active');
    b60.classList.add('active'); bDay.classList.remove('active');
    if(label) label.textContent='目前：60分K';
    setTimeout(()=>{
      const gd=getChart('intraday-chart');
      if(gd&&window.Plotly) Plotly.Plots.resize(gd);
      syncPenCanvas('intraday-chart');
      styleModeButtons(gd);
    },80);
  } else {
    p60.classList.remove('active'); pDay.classList.add('active');
    b60.classList.remove('active'); bDay.classList.add('active');
    if(label) label.textContent='目前：日K';
    setTimeout(()=>{
      const gd=getChart('daily-chart');
      if(gd&&window.Plotly) Plotly.Plots.resize(gd);
      syncPenCanvas('daily-chart');
      styleModeButtons(gd);
    },80);
  }
}

setTimeout(initChartTools, 500);
</script>
