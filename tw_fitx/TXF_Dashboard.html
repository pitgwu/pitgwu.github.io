    p60.classList.add('active'); pDay.classList.remove('active');
    b60.classList.add('active'); bDay.classList.remove('active');
    setTimeout(() => {
      const gd = document.getElementById('intraday-chart');
      if (gd && window.Plotly) Plotly.Plots.resize(gd);
    }, 50);
  } else {
    p60.classList.remove('active'); pDay.classList.add('active');
    b60.classList.remove('active'); bDay.classList.add('active');
    setTimeout(() => {
      const gd = document.getElementById('daily-chart');
      if (gd && window.Plotly) Plotly.Plots.resize(gd);
    }, 50);
  }
}
</script>
</body>
</html>
